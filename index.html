<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoHome Nhơn Bình - Chợ Rao Vặt</title>

  <!-- Tailwind (dev CDN ok for testing) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase v10 compat (kept here) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <!-- ========== INLINED common.js START ========== -->
  <script>
    /* Inlined common.js (ECOHOME) - provides window.Eco and compatibility mappings
       - This replaces an external common.js file. Make sure to remove external <script src="common.js"> if exists.
    */

    // Firebase config (same as in index)
    const _ECO_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCxS6oT6h9XTc-rB3X1gSnlfvNfshy7Mxs",
      authDomain: "rao-vat-ecohome-3d11d.firebaseapp.com",
      projectId: "rao-vat-ecohome-3d11d",
      storageBucket: "rao-vat-ecohome-3d11d.firebasestorage.app",
      messagingSenderId: "610650533071",
      appId: "1:610650533071:web:522508a572b17da9ad9bba"
    };

    (function initEcoNamespace() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(_ECO_FIREBASE_CONFIG);
        }
      } catch (e) {
        console.warn('Firebase init error (might already be initialized)', e);
      }

      // Primary ECO namespace
      const ECOHOME = {
        auth: firebase && firebase.auth ? firebase.auth() : null,
        db: firebase && firebase.firestore ? firebase.firestore() : null,
        storage: firebase && firebase.storage ? firebase.storage() : null,
        adminEmails: ['phamvanconcn@gmail.com'],
        checkIsAdmin: async function(user) {
          if (!user) return false;
          // Basic email check; override with real rule if needed
          return this.adminEmails.includes(user.email);
        },
        showToast: function(msg, type='info') {
          const t = document.getElementById('toast');
          if (!t) { console.log('[Toast]', type, msg); return; }
          t.innerText = msg;
          t.style.backgroundColor = type === 'error' ? '#ef4444' : '#111827';
          t.classList.remove('hidden');
          setTimeout(()=> t.classList.add('hidden'), 3500);
        },
        listenSystemSettings: function(callback) {
          if (!this.db) return () => {};
          try {
            return this.db.collection('settings').doc('payment')
              .onSnapshot(doc => callback(doc.exists ? doc.data() : null),
                          err => console.error('listen settings error', err));
          } catch(e){
            console.error('listenSystemSettings error', e);
            return () => {};
          }
        },
        updateAdminPayment: async function(bankName, account, qrFile) {
          if (!this.db || !this.storage) throw new Error('Firebase not ready');
          const payload = { bankName, account, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
          if (qrFile) {
            const ref = this.storage.ref(`settings/payment_qr_${Date.now()}_${qrFile.name}`);
            const task = await ref.put(qrFile);
            payload.qrUrl = await task.ref.getDownloadURL();
          }
          return this.db.collection('settings').doc('payment').set(payload, { merge: true });
        },
        approveVipUser: async function(purchaseId, uid) {
          if (!this.db) throw new Error('Firestore not ready');
          const batch = this.db.batch();
          const pRef = this.db.collection('purchases').doc(purchaseId);
          batch.update(pRef, { status: 'approved', approvedAt: firebase.firestore.FieldValue.serverTimestamp() });
          const uRef = this.db.collection('users').doc(uid);
          batch.set(uRef, { tier: 'vip_pro', tierAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          return batch.commit();
        },
        escapeHtml: function(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; },

        // small utilities (may be used by older inline handlers)
        tryParseJSON: function(s) { try { return JSON.parse(s); } catch(e) { return null; } }
      };

      // Admin password verification helper (exposed)
      ECOHOME.verifyAdminPassword = function(plain) {
        // Simple example — in real app DO NOT store plain passwords in client.
        // This is a fallback convenience: compare to known hash OR prompt to login with Google?
        const ADMIN_PASS = ''; // left blank — prefer Google login
        if (!ADMIN_PASS) return false;
        return plain === ADMIN_PASS;
      };

      // Google login helper for admin flows
      ECOHOME.loginGoogleAdmin = async function() {
        if (!ECOHOME.auth) throw new Error('Auth not initialized');
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          const res = await ECOHOME.auth.signInWithPopup(provider);
          // After sign-in, check admin
          const user = res.user;
          const isAdmin = await ECOHOME.checkIsAdmin(user);
          if (!isAdmin) {
            ECOHOME.showToast('Tài khoản không có quyền admin', 'error');
            // optionally sign out
            setTimeout(()=> ECOHOME.auth.signOut(), 800);
            return null;
          }
          ECOHOME.showToast('Đăng nhập admin thành công');
          return user;
        } catch (err) {
          console.error('loginGoogleAdmin error', err);
          ECOHOME.showToast('Lỗi đăng nhập', 'error');
          throw err;
        }
      };

      // Backward-compatibility: expose as window.Eco and also map some functions to globals
      window.Eco = ECOHOME;

      // Common global mappings so inline onclick handlers still work if they expect global functions
      const mappings = {
        verifyAdminPassword: function() { return ECOHOME.verifyAdminPassword.apply(ECOHOME, arguments); },
        loginGoogleAdmin: function() { return ECOHOME.loginGoogleAdmin.apply(ECOHOME, arguments); },
        // If older code expects goStep/selectType/filterCat etc, add no-op placeholders or simple stubs:
        goStep: function() { console.warn('goStep stub called', arguments); },
        selectType: function() { console.warn('selectType stub called', arguments); },
        filterCat: function() { console.warn('filterCat stub called', arguments); }
      };

      Object.keys(mappings).forEach(k => { if (typeof window[k] === 'undefined') window[k] = mappings[k]; });

      console.log('✅ Eco (inlined) initialized');
    })();
  </script>
  <!-- ========== INLINED common.js END ========== -->

  <style>
    :root { --eco-green: #2d8a3c; --eco-blue: #0076a3; --bg: #f8fafc; }
    body { background: var(--bg); font-family: 'Segoe UI', Roboto, sans-serif; }
    .btn-primary { background-color: var(--eco-green); color: white; font-weight: 700; }
    .card { background: white; border-radius: 10px; border: 1px solid #eef2f6; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 60; background: rgba(2,6,23,0.6); padding: 16px; }
    .modal.active { display: flex; }
    .badge-block { background: var(--eco-blue); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 6px; }
    .price { color: #d0021b; font-weight: 700; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hidden-xs { display: none; }
    @media(min-width:640px){ .hidden-xs { display: block; } }
    .filter-chip { padding:6px 10px; border-radius:8px; border:1px solid #e6edf3; cursor:pointer; font-size:13px; }
    .filter-chip.active { background:var(--eco-green); color:white; border-color:transparent; }

    /* VIP responsive styles */
    .vip-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: stretch; }
    .vip-card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display:flex; flex-direction:column; gap:8px; align-items:flex-start; min-width: 140px; }
    .vip-title { font-size: 15px; font-weight:700; }
    .vip-price { color: #16a34a; font-weight:800; }
    .vip-pay { background: var(--eco-green); color: #fff; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; width:100%; text-align:center; }

    @media (max-width: 640px) {
      .vip-list { display:flex; gap:10px; overflow-x:auto; padding:8px 4px; }
      .vip-card { min-width: 160px; padding:10px; border-radius:8px; }
      header .max-w-6xl { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
      <img src="https://cdn.abacus.ai/images/08379504-c82c-404b-89e1-34ac87a1e264.png" alt="EcoHome" class="h-14 object-contain">
      <div class="hidden-xs">
        <div class="font-bold text-lg text-slate-700">EcoHome Nhơn Bình</div>
        <div class="text-[11px] text-slate-500">Chợ nội bộ cư dân & rao vặt</div>
      </div>
    </div>

    <div class="flex-1 px-4 max-w-2xl">
      <div class="relative">
        <input id="main-search" class="w-full border rounded-full px-4 py-2 text-sm" placeholder="Tìm kiếm: tiêu đề, vị trí, điện thoại..." />
        <button class="absolute right-3 top-2 text-gray-400" onclick="handleSearch()"><i class="fas fa-search"></i></button>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div id="auth-info" class="text-sm text-slate-600 cursor-pointer" onclick="handleAuthClick()">Đăng nhập</div>
      <button class="btn-primary px-4 py-2 rounded-full" onclick="openPostModal()"><i class="fas fa-plus mr-2"></i>Đăng tin</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <!-- ... rest of content unchanged ... -->
  <!-- (the rest of your index.html body remains as in your original file) -->
</main>

<!-- POST Modal -->
<div id="post-modal" class="modal">
  <!-- ... -->
</div>

<!-- BUY VIP Modal (unchanged modal for uploading proof / bank info / QR) -->
<div id="buy-vip-modal" class="modal">
  <!-- ... -->
</div>

<!-- Admin Payment Panel -->
<div id="admin-payment-panel" class="modal" style="display:none">
  <!-- ... -->
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded hidden z-50"></div>

<script>
  // ---- Use shared Eco object from inlined script above ----
  if (typeof window.Eco === 'undefined') {
    console.error('Eco not initialized. Check inlined common.js code.');
  }
  const { auth, db, storage } = window.Eco || {};

  // ==== VIP_PACKAGES + main page logic (same as original index file) ====
  const VIP_PACKAGES = {
    vip: { price: 50000, days: 60, label: 'VIP (60 ngày)' },
    vips: { price: 10000, days: 90, label: 'VIPS (90 ngày)' },
    vipss: { price: 150000, days: 120, label: 'VIPSS (120 ngày)' },
    vipsss: { price: 10000, days: 0, label: 'VIPSSS (Vĩnh viễn)' }
  };

  // state variables, renderVipCards(), handlers, fetchData(), etc.
  // ... (copy the rest of your existing index script logic here) ...

  // Example: renderVipCards (from your original file)
  function renderVipCards() {
    const container = document.getElementById('vip-list');
    if (!container) return;
    container.innerHTML = '';
    Object.keys(VIP_PACKAGES).forEach(key => {
      const pkg = VIP_PACKAGES[key];
      const card = document.createElement('div');
      card.className = 'vip-card';
      card.innerHTML = `
        <div class="vip-title">${pkg.label}</div>
        <div class="vip-price">${new Intl.NumberFormat('vi-VN').format(pkg.price)} đ</div>
        <button class="vip-pay" data-pkg="${key}" onclick="onVipPayClick(this)">Mua & Mở App</button>
        <button class="vip-pay" style="background:#444;margin-top:6px;" data-pkg="${key}" onclick="openBuyVipModal('${key}')">Mua & Gửi bằng chứng</button>
      `;
      container.appendChild(card);
    });
  }
  renderVipCards();

  // Place the rest of your original scripts here unchanged (fetchData, auth handlers, uploadPost, etc.)
</script>
</body>
</html>
