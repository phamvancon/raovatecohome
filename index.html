<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EcoHome Nhơn Bình - Chợ Rao Vặt</title>

  <!-- Thư viện hỗ trợ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <script>
    /* ==========================================
       GỘP LOGIC COMMON.JS (ECOHOME) VÀO ĐÂY
       ========================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyCxS6oT6h9XTc-rB3X1gSnlfvNfshy7Mxs",
      authDomain: "rao-vat-ecohome-3d11d.firebaseapp.com",
      projectId: "rao-vat-ecohome-3d11d",
      storageBucket: "rao-vat-ecohome-3d11d.firebasestorage.app",
      messagingSenderId: "610650533071",
      appId: "1:610650533071:web:522508a572b17da9ad9bba"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    window.Eco = {
      auth: firebase.auth(),
      db: firebase.firestore(),
      storage: firebase.storage(),
      adminEmails: ['phamvanconcn@gmail.com'],
      checkIsAdmin: async function(user) { 
        return !!user && this.adminEmails.includes(user.email); 
      },
      showToast: function(msg, type='info') {
        const t = document.getElementById('toast');
        if (t) { 
          t.innerText = msg; 
          t.style.backgroundColor = type === 'error' ? '#ef4444' : '#111827'; 
          t.classList.remove('hidden'); 
          setTimeout(()=> t.classList.add('hidden'), 3500); 
        }
      }
    };

    // Mapping global cho các nút bấm onclick cũ
    window.loginGoogleAdmin = async function() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const res = await window.Eco.auth.signInWithPopup(provider);
        const isAdmin = await window.Eco.checkIsAdmin(res.user);
        if (isAdmin) { 
          window.Eco.showToast('Chào Admin!'); 
          location.reload(); 
        } else { 
          window.Eco.showToast('Bạn không phải Admin', 'error'); 
          window.Eco.auth.signOut(); 
        }
      } catch (e) { window.Eco.showToast('Lỗi đăng nhập', 'error'); }
    };
    
    window.verifyAdminPassword = function() { return false; }; // Placeholder
  </script>

  <style>
    :root { --eco-green: #2d8a3c; --eco-blue: #0076a3; --bg: #f8fafc; }
    body { background: var(--bg); font-family: 'Segoe UI', sans-serif; }
    .btn-primary { background: var(--eco-green); color: #fff; font-weight: 700; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 60; background: rgba(0,0,0,0.5); }
    .modal.active { display: flex; }
    .vip-card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); min-width: 160px; flex-shrink: 0; }
    .filter-chip { padding:6px 12px; border-radius:8px; border:1px solid #ddd; cursor:pointer; background: #fff; white-space: nowrap; }
    .filter-chip.active { background: var(--eco-green); color: #fff; border-color: transparent; }
  </style>
</head>
<body>

<header class="bg-white shadow sticky top-0 z-50 p-3">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
    <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
        <img src="https://cdn.abacus.ai/images/08379504-c82c-404b-89e1-34ac87a1e264.png" class="h-10" alt="Logo">
        <span class="font-bold text-slate-700 hidden sm:inline">EcoHome Nhơn Bình</span>
    </div>
    <div class="flex items-center gap-4">
      <div id="auth-info" class="text-sm cursor-pointer hover:underline" onclick="handleAuthClick()">Đăng nhập</div>
      <button class="btn-primary px-4 py-2 rounded-full text-sm" onclick="openPostModal()"><i class="fas fa-plus mr-1"></i> Đăng tin</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-4">
  <!-- Gói VIP -->
  <section class="mb-6 p-4 bg-white rounded-lg shadow">
    <h3 class="font-bold mb-3 text-lg">Gói VIP Ưu Tiên</h3>
    <div id="vip-list" class="flex gap-4 overflow-x-auto pb-2">
      <!-- Injected by JS -->
    </div>
  </section>

  <!-- Bộ lọc -->
  <section class="mb-4 flex gap-2 overflow-x-auto pb-2">
    <div class="filter-chip active" onclick="setCat('', this)">Tất cả</div>
    <div class="filter-chip" onclick="setCat('Block 1', this)">Block 1</div>
    <div class="filter-chip" onclick="setCat('Block 5', this)">Block 5</div>
    <div class="filter-chip" onclick="setCat('Do dung', this)">Đồ dùng</div>
  </section>

  <!-- Lưới tin đăng -->
  <div id="listing-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <!-- Injected by JS -->
  </div>
</main>

<!-- Modal Đăng tin -->
<div id="post-modal" class="modal">
  <div class="bg-white p-6 rounded-lg w-full max-w-md mx-4 overflow-y-auto max-h-[90vh]">
    <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">Đăng tin rao vặt</h3>
        <button class="text-2xl" onclick="closeModal('post-modal')">&times;</button>
    </div>
    <input id="p-title" placeholder="Tiêu đề" class="w-full border p-2 mb-2 rounded">
    <input id="p-price" type="number" placeholder="Giá (VND)" class="w-full border p-2 mb-4 rounded">
    <textarea id="p-desc" placeholder="Mô tả chi tiết..." class="w-full border p-2 mb-4 rounded" rows="3"></textarea>
    <button class="btn-primary w-full py-3 rounded-lg" onclick="uploadPost()">Đăng ngay</button>
  </div>
</div>

<div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 text-white px-6 py-3 rounded-full hidden z-[100] shadow-xl text-center"></div>

<script>
  let currentUser = null;
  const VIP_PACKAGES = {
    v1: { price: 50000, label: 'VIP (60 ngày)' },
    v2: { price: 100000, label: 'VIPS (90 ngày)' },
    v3: { price: 150000, label: 'VIPSS (120 ngày)' }
  };

  function renderVip() {
    const list = document.getElementById('vip-list');
    Object.keys(VIP_PACKAGES).forEach(k => {
        const p = VIP_PACKAGES[k];
        list.innerHTML += `
          <div class="vip-card">
            <div class="text-sm font-bold">${p.label}</div>
            <div class="text-green-600 font-bold my-2 text-md">${p.price.toLocaleString()}đ</div>
            <button class="btn-primary text-xs px-3 py-1.5 rounded-md w-full" onclick="window.Eco.showToast('Hệ thống thanh toán đang nâng cấp')">Đăng ký</button>
          </div>`;
    });
  }

  window.Eco.auth.onAuthStateChanged(async user => {
    currentUser = user;
    const info = document.getElementById('auth-info');
    if (user) {
        info.innerHTML = `<img src="${user.photoURL || 'https://via.placeholder.com/30'} " class="w-6 h-6 rounded-full inline mr-1"> ${user.displayName || 'Tài khoản'}`;
        const isAdmin = await window.Eco.checkIsAdmin(user);
        if (isAdmin) info.innerHTML += ' <span class="bg-red-100 text-red-600 text-[10px] px-1 rounded">Admin</span>';
    } else { info.innerText = 'Đăng nhập'; }
  });

  function handleAuthClick() {
    if (currentUser) { if(confirm('Đăng xuất?')) window.Eco.auth.signOut(); }
    else window.loginGoogleAdmin();
  }

  async function fetchData() {
    const grid = document.getElementById('listing-grid');
    grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-20">Đang tải dữ liệu...</p>';
    try {
        const snap = await window.Eco.db.collection('market').orderBy('createdAt','desc').limit(20).get();
        grid.innerHTML = '';
        if (snap.empty) {
            grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-20">Chưa có tin rao nào.</p>';
            return;
        }
        snap.forEach(doc => {
            const d = doc.data();
            grid.innerHTML += `
                <div class="card p-2 bg-white rounded-lg shadow-sm hover:shadow-md transition cursor-pointer">
                    <div class="h-32 bg-gray-200 mb-2 rounded-md" style="background:url(${d.images?.[0] || 'https://via.placeholder.com/300x200'}) center/cover"></div>
                    <div class="font-bold line-clamp-1 text-sm text-slate-700">${d.title}</div>
                    <div class="text-red-600 font-bold mt-1 text-sm">${(d.price||0).toLocaleString()}đ</div>
                </div>`;
        });
    } catch (e) {
        grid.innerHTML = '<p class="col-span-full text-center text-red-400">Không thể kết nối dữ liệu.</p>';
    }
  }

  window.openPostModal = () => {
    if (!currentUser) return window.loginGoogleAdmin();
    document.getElementById('post-modal').classList.add('active');
  };
  window.closeModal = id => document.getElementById(id).classList.remove('active');
  window.setCat = (c, el) => { 
    document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active')); 
    el.classList.add('active'); 
    fetchData(); // Trong thực tế sẽ code logic filter Firestore
  };

  async function uploadPost() {
    const title = document.getElementById('p-title').value;
    const price = document.getElementById('p-price').value;
    if (!title || !price) return window.Eco.showToast('Vui lòng điền đủ thông tin', 'error');
    
    try {
        await window.Eco.db.collection('market').add({
            title, price: Number(price),
            uid: currentUser.uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        window.Eco.showToast('Đăng tin thành công!');
        closeModal('post-modal');
        fetchData();
    } catch(e) { window.Eco.showToast('Lỗi đăng tin', 'error'); }
  }

  renderVip();
  fetchData();
</script>
</body>
</html>
