<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecohome</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body class="bg-gray-100">

<div id="app" class="max-w-[500px] mx-auto bg-white min-h-screen">

<h1 class="text-xl font-bold p-4">Ecohome Marketplace</h1>

<div class="p-4">
<input v-model="title" placeholder="Tiêu đề"
class="border p-2 w-full mb-2">

<input v-model="price" placeholder="Giá"
class="border p-2 w-full mb-2">

<button @click="addPost"
class="bg-green-600 text-white px-4 py-2 rounded">
Đăng tin
</button>
</div>

<div class="p-4 space-y-2">
<div v-for="p in posts" :key="p.id"
class="border p-3 rounded">

<b>{{p.title}}</b><br>
{{p.price}} đ

<button @click="del(p.id)"
class="text-red-500 ml-2">Xóa</button>

</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBarAIDkBaifVuPg7yJV14gFd0lUPzUXH4",
  authDomain: "ecohome-marketplace.firebaseapp.com",
  projectId: "ecohome-marketplace",
  storageBucket: "ecohome-marketplace.firebasestorage.app",
  messagingSenderId: "735893375122",
  appId: "1:735893375122:web:479e1c186b15291f5abe4b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await signInAnonymously(auth);

const { createApp, ref, onMounted } = Vue;

createApp({
setup() {

const posts = ref([]);
const title = ref('');
const price = ref('');

onMounted(() => {
onSnapshot(collection(db, "posts"), snap => {
posts.value = snap.docs.map(d => ({
id: d.id, ...d.data()
}));
});
});

const addPost = async () => {
if (!title.value) return;

await addDoc(collection(db, "posts"), {
title: title.value,
price: price.value
});

title.value = '';
price.value = '';
};

const del = async (id) => {
await deleteDoc(doc(db, "posts", id));
};

return { posts, title, price, addPost, del };

}
}).mount("#app");
</script>

</body>
</html>
